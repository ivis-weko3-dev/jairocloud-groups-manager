apiVersion: v1
kind: Secret
metadata:
  namespace: __NAMESPACE__
  name: __DOMAIN_NAME__-middleware
type: Opaque
stringData:
  # deploy/middleware (検証用 PostgreSQL) が参照する。
  # server.config.toml の [postgres] password と同じ値が入るよう
  # make_jcgroups_manifests.sh が両方へ同じ __POSTGRES_PASSWORD__ を展開する。
  POSTGRES_PASSWORD: "__POSTGRES_PASSWORD__"

# 以下の Secret はファイルから作るため deploy_jcgroups.sh が
# `kubectl create secret` で作成する (マニフェスト化すると中身が Git に載る)。
#
#   __DOMAIN_NAME__-secret              : server.config.toml
#   __DOMAIN_NAME__-tls                 : nginx / Shibboleth SP のサーバ証明書
#   __DOMAIN_NAME__-cert                : Ingress 用 TLS Secret (kubernetes.io/tls)
#   __DOMAIN_NAME__-sp-cert             : mAP Core 接続用クライアント証明書
#   __DOMAIN_NAME__-institution-certs   : 機関別クライアント証明書 (任意)
